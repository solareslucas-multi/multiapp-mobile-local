# docker-compose.yml — GrowthBook self-hosted (compatible con Docker y Podman)
# Uso:  make up        (o: docker compose up -d  /  podman compose up -d)
#
# Endpoints una vez arriba:
#   UI  -> http://localhost:3000
#   API -> http://localhost:3100
#
# Configuración sensible (JWT_SECRET, credenciales de Mongo, etc.) se toma de
# .env si existe; si no, se usan los defaults de desarrollo. Ver .env.example.

services:
  mongo:
    image: docker.io/library/mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongodata:/data/db

  growthbook:
    # Pin a release tag (not latest) so every clone runs the same version:
    # https://github.com/growthbook/growthbook/releases
    image: docker.io/growthbook/growthbook:5.0.0
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000" # UI
      - "3100:3100" # API
    environment:
      NODE_ENV: production
      MONGODB_URI: "mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-password}@mongo:27017/${MONGO_INITDB_DATABASE:-growthbook}?authSource=admin"
      APP_ORIGIN: "http://localhost:3000"
      API_HOST: "http://localhost:3100"
      JWT_SECRET: "${JWT_SECRET:-dev-only-multiapp-jwt-secret-not-for-production}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-dev-only-multiapp-encryption-key-not-for-production}"
    volumes:
      - uploads:/usr/local/src/app/packages/back-end/uploads

volumes:
  mongodata:
  uploads: