# docker-compose.yml — GrowthBook self-hosted (compatible con Podman)
# Uso:  podman compose up -d      (o: podman-compose up -d)
#
# Endpoints una vez arriba:
#   UI  -> http://localhost:3000
#   API -> http://localhost:3100

services:
  mongo:
    image: docker.io/library/mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodata:/data/db

  growthbook:
    image: docker.io/growthbook/growthbook:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000" # UI
      - "3100:3100" # API
    environment:
      NODE_ENV: production
      MONGODB_URI: "mongodb://root:password@mongo:27017/growthbook?authSource=admin"
      APP_ORIGIN: "http://localhost:3000"
      API_HOST: "http://localhost:3100"
      JWT_SECRET: "577NN1CWTFVqt0W8DZqHAYicS9PrjAwyWA/ulZvDRDo="
      ENCRYPTION_KEY: "577NN1CWTFVqt0W8DZqHAYicS9PrjAwyWA/ulZvDRDo="
    volumes:
      - uploads:/usr/local/src/app/packages/back-end/uploads

volumes:
  mongodata:
  uploads:
